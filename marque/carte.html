<!doctype html>
<html lang="fr" data-w="85" data-h="55" data-titre="Carte de visite ChantierLive (85 × 55 mm, recto verso)">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte de visite ChantierLive</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,0..100;1,9..144,400..600,0..100&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
:root{--marge:6mm}
.page{margin:6mm auto}
.recto .in{align-items:flex-start;justify-content:space-between}
.recto .logo{width:44mm;display:block}
.recto .slogan{font-family:var(--serif);font-size:9pt;font-weight:400;letter-spacing:-.01em;color:rgba(247,243,235,.85)}
.recto .slogan em{color:#F08A66;font-style:italic;font-variation-settings:'SOFT' 60}
.recto .site{font-size:6.2pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(247,243,235,.62)}
.recto .coin{position:absolute;right:-9mm;bottom:-9mm;width:34mm;opacity:.14}
.verso .in{display:grid;grid-template-columns:1fr auto;gap:4mm;align-items:end}
.verso .nom{font-family:var(--serif);font-weight:500;font-size:12.5pt;letter-spacing:-.02em;line-height:1.05}
.verso .titre{font-size:6.2pt;letter-spacing:.1em;white-space:nowrap;text-transform:uppercase;font-weight:700;color:var(--signal);margin-top:1.2mm}
.verso .soc{font-size:6.4pt;color:var(--ciment);margin-top:.6mm}
.verso .coord{margin-top:3mm;font-size:6.9pt;line-height:1.55}
.verso .coord a{color:inherit;text-decoration:none}
.verso .coord b{font-weight:700}
.verso .qr{width:15mm;height:15mm}
.verso .mark{position:absolute;right:var(--marge);top:var(--marge);width:9mm}
.verso .villes{font-size:6pt;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ciment);margin-top:2mm}
</style>
</head>
<body>

<!-- Recto -->
<section class="page dark recto">
  <div class="grain"></div>
  <img class="coin" src="../assets/brand/mark-inverse.svg" alt="">
  <div class="in">
    <img class="logo" src="../assets/brand/logo-inverse.svg" alt="ChantierLive">
    <div><div class="slogan">Votre chantier, <em>en direct</em>.</div><div class="site" style="margin-top:1.4mm">chantierlive.com</div></div>
  </div>
</section>

<!-- Verso -->
<section class="page verso">
  <img class="mark" src="../assets/brand/mark.svg" alt="">
  <div class="in">
    <div>
      <div class="nom" data-champ="nom">Dr Paul Mirabeau Byande</div>
      <div class="titre" data-champ="titre">Directeur de programmes</div>
      <div class="soc" data-champ="societe">LevENT-IT · ETS 2BY Consulting</div>
      <div class="coord">
        <a data-champ="tel" data-href="tel:" href="tel:+33629763965">+33 6 29 76 39 65</a> <span class="muted">· WhatsApp <a data-champ="wa" data-href="tel:" href="tel:+237650157461">+237 6 50 15 74 61</a></span><br>
        <a data-champ="mail" data-href="mailto:" href="mailto:contact@chantierlive.com">contact@chantierlive.com</a> <span class="muted">·</span> <a data-champ="mail2" data-href="mailto:" href="mailto:paulbyande@levent-it.com">paulbyande@levent-it.com</a><br>
        <b>chantierlive.com</b>
      </div>
      <div class="villes" data-champ="villes">Paris · Douala · Conakry</div>
    </div>
    <img class="qr" src="kit/qr-site.svg" alt="QR code : chantierlive.com">
  </div>
</section>
</body></html>
